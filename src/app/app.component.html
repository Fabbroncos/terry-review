<h1 style="color: blueviolet; text-align: center">Terry Review</h1>

<div
  style="display: flex; flex-direction: column; padding-inline: 25%; gap: 1rem"
>
  <div style="display: flex; justify-content: space-between">
    <input
      style="width: 75%"
      [(ngModel)]="review_title"
      type="text"
      name="title"
      id="title"
    />
    <input
      style="width: 20%"
      [(ngModel)]="vote"
      type="number"
      id="vote"
      min="0"
      max="100"
      step="0.5"
      name="vote"
    />
  </div>
  <textarea
    [(ngModel)]="review_text"
    name="review"
    id="review"
    rows="20"
  ></textarea>
  <button type="submit" (click)="addReview()">Pubblica</button>
</div>

<div>
  <ul>
    <li *ngFor="let item of review_list">
      <h4>
        {{ item.title }} - <span>{{ item.vote }}</span>
      </h4>
      <p>{{ item.review_text }}</p>
    </li>
  </ul>
</div>
